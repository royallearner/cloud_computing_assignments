<h1>Cloud Computing – Question Bank</h1>
<p class="sub">NPTEL, IIT Kharagpur. Each answer shows the correct option, why it is right, and why every other option is wrong.</p>
<nav id="nav"></nav>
<div id="out"></div>
</main>
<script>
// [week, number, question, [options A-D], answer index, why correct, [why wrong for each other option, in order]]
const D=[
[1,1,"Which of the following best represents the meaning of resource pooling in cloud computing?",["Every customer receives a permanently dedicated physical server.","Computing resources are dynamically assigned to multiple customers using a shared infrastructure.","Resources can only be accessed from a local network.","Users must manually allocate hardware before using cloud services."],1,"Resource pooling is a NIST essential characteristic: one shared pool of resources serves many customers and is assigned and reassigned as demand changes.",["A dedicated server per customer is the opposite of pooling.","Cloud resources are reachable over the network (broad network access), not only a local one.","Cloud users provision resources on demand with no manual hardware allocation."]],
[1,2,"A startup rents virtual servers on Amazon EC2. The team installs and patches its own operating system, configures the web server, and manages the runtime and applications itself. The provider supplies only the virtualized compute, storage, and networking. This is best classified as:",["SaaS","PaaS","IaaS","FaaS"],2,"In IaaS the provider gives virtual compute, storage and networking, and the customer manages the OS, runtime and applications.",["In SaaS the provider runs everything, including the application.","In PaaS the provider also manages the OS and runtime; the customer only deploys code.","In FaaS the customer uploads small functions and manages no servers or OS."]],
[1,3,"Which deployment model allows an organization to maintain cloud infrastructure exclusively for its own use, either on-premises or hosted by a third party?",["Public Cloud","Hybrid Cloud","Community Cloud","Private Cloud"],3,"A private cloud is dedicated to one organization, giving more control over security, compliance and resources.",["A public cloud is open to the general public and shared.","A hybrid cloud combines private and public clouds, so it is not exclusive.","A community cloud is shared by several organizations with common concerns."]],
[1,4,"Virtualization technology allows multiple virtual machines (VMs) to run on a single physical system or on a cluster of physical systems. Which of the following statements is the MOST accurate?",["Each VM always shares the same operating system kernel with the host OS.","Multiple VMs can run different operating systems on the same physical machine simultaneously.","Virtualization is only possible in cloud computing environments.","Virtualization prevents resource overcommitment on the host system."],1,"Hypervisors such as VMware and KVM let VMs with different guest operating systems share the same hardware at once.",["Sharing the host kernel describes containers; a full VM has its own guest kernel.","Virtualization existed before cloud computing and works on ordinary servers and desktops.","Overcommitting CPU or memory is a commonly used feature, not something virtualization prevents."]],
[1,5,"Consider the following statements about distributed systems (DS): (i) DS can improve scalability by adding more nodes to the system. (ii) DS can increase fault tolerance through data and service replication. (iii) DS guarantees lower latency for every single operation compared to a centralized system. Choose the MOST APPROPRIATE option:",["(i) and (ii)","Only (iii)","(i) and (iii)","(i), (ii), and (iii)"],0,"(i) and (ii) are true. (iii) is false because distribution adds network communication and coordination overhead, so some operations get slower.",["Statement (iii) is false, so \"only (iii)\" cannot be right; it also drops the true (i) and (ii).","This includes the false statement (iii).","This also includes the false statement (iii)."]],
[1,6,"The combination of Service-Oriented Architecture (SOA) and Cloud Computing led to a paradigm where almost any IT capability can be delivered as a network-accessible service. This is often referred to as:",["FTP","SNTP","XaaS","FaaS"],2,"XaaS means Anything/Everything as a Service, the umbrella term for delivering diverse IT capabilities as services.",["FTP is a file transfer protocol.","SNTP is a time synchronization protocol.","FaaS (Functions as a Service) is only one specific service model, not the broad paradigm."]],
[1,7,"Which of the following correctly describes a Type-2 (hosted) hypervisor?",["It runs directly on the physical hardware without any underlying operating system.","It runs as an application on top of a host operating system.","It always provides lower virtualization overhead than a Type-1 hypervisor.","It cannot run more than one virtual machine at a time."],1,"A Type-2 hypervisor (VirtualBox, VMware Workstation) is an application running on a host OS.",["That describes a Type-1 (bare-metal) hypervisor.","Type-1 usually has lower overhead, because Type-2 goes through the host OS.","Hosted hypervisors can run many VMs at the same time."]],
[1,8,"Which of the following are advantages of Platform-as-a-Service (PaaS)? (i) Developers can focus primarily on application development. (ii) Automatic software updates for the underlying platform. (iii) Complete control over physical server hardware. (iv) Faster application deployment.",["(i), (ii), and (iv)","(ii) and (iii)","(i) and (iii)","(i), (ii), (iii), and (iv)"],0,"PaaS hides infrastructure and provides a managed runtime, so (i), (ii) and (iv) are advantages.",["It includes (iii), which is false, and leaves out (i) and (iv).","It includes (iii), which is false, and leaves out (ii) and (iv).","It includes (iii): PaaS users never control physical hardware."]],
[1,9,"Which of the following services is most likely to be classified as Infrastructure as a Service (IaaS)?",["Microsoft Word Online","Amazon EC2 Virtual Machines","Google Docs","Salesforce CRM"],1,"EC2 provides virtual machines where users manage the OS, software and applications, which is IaaS.",["Word Online is a ready-to-use application (SaaS).","Google Docs is a ready-to-use application (SaaS).","Salesforce CRM is a ready-to-use application (SaaS)."]],
[1,10,"A __________ is a form of distributed computing in which a large number of geographically dispersed and often heterogeneous resources across multiple administrative domains are loosely coupled and coordinated to work together on a common, large-scale task.",["Cluster","Grid","Node","Hypervisor"],1,"A grid coordinates dispersed, heterogeneous, loosely coupled resources from several administrative domains.",["A cluster is tightly coupled and usually located together.","A node is just one machine.","A hypervisor is virtualization software, not a distributed system."]],
[2,1,"A virtualization solution requires the guest operating system to invoke hypercalls instead of executing certain privileged instructions directly. This approach is known as:",["Full Virtualization","Hardware-assisted Virtualization","Para-virtualization","Containerization"],2,"Para-virtualization modifies the guest OS so privileged operations go through hypercalls to the hypervisor. This lowers overhead but needs OS modification.",["Full virtualization runs an unmodified guest OS, so no hypercalls are needed.","Hardware-assisted virtualization uses CPU extensions with an unmodified guest OS.","Containers share the host kernel and have no guest OS making hypercalls."]],
[2,2,"Which of the following is a key characteristic of full (hardware-assisted) virtualization, as opposed to para-virtualization?",["Guest OS must be modified to issue hypercalls to the hypervisor.","Guest OS runs unmodified, with the hypervisor and CPU extensions handling privileged instructions.","Guest and host must share the same operating system kernel.","No hypervisor is involved at all."],1,"The guest OS stays unmodified while CPU extensions (Intel VT-x, AMD-V) and the hypervisor handle privileged instructions transparently.",["That describes para-virtualization.","Sharing one kernel describes containers.","A hypervisor is always present in virtualization."]],
[2,3,"Which statement about a public cloud is MOST accurate?",["It is dedicated to, and controlled by, a single organization behind its own firewall.","Its infrastructure is provisioned for open use by the general public and is owned and operated by a cloud service provider.","It is shared only among organizations that have common regulatory concerns.","It always guarantees stronger data isolation than a private cloud."],1,"A public cloud is open to the general public and is owned, managed and operated by a cloud service provider on its own premises.",["That describes a private cloud.","That describes a community cloud.","Private clouds typically provide stronger isolation, and \"always\" makes this false."]],
[2,4,"An application must repeatedly navigate, randomly access, and modify elements of a moderately sized XML document held in memory. Which XML parser API is MOST appropriate?",["SAX (push-based, event-driven, forward-only)","StAX (pull-based, event-driven, forward-only)","DOM (builds an in-memory tree allowing random access and modification)","None; an XML document cannot be modified once parsed"],2,"DOM builds the whole document as an in-memory tree, so you can jump to any element and change it.",["SAX is forward-only streaming; it cannot revisit or modify elements.","StAX is also forward-only streaming and not built for random access or edits.","XML documents can be modified once parsed, for example with DOM."]],
[2,5,"Which statement correctly distinguishes a 'host OS', a 'guest OS', and a 'hypervisor'?",["The host OS runs inside a VM, the guest OS runs on bare metal, and the hypervisor is a user application.","The hypervisor creates and manages VMs; each guest OS runs inside a VM; and for a Type-2 hypervisor, the host OS is the OS on which the hypervisor runs.","The guest OS and host OS are always identical copies of the same operating system.","The hypervisor is simply the hardware layer located beneath the host OS."],1,"The hypervisor creates and manages VMs, each guest OS runs inside its own VM, and in a Type-2 setup the host OS is the OS the hypervisor runs on.",["This reverses the host and guest roles.","Guest and host can be completely different operating systems.","The hypervisor is software, not a hardware layer."]],
[2,6,"An enterprise migrates its private cloud to a third-party managed data center. Which of the following concerns should be evaluated? (i) Service availability guarantees (SLAs) (ii) Compliance with data protection regulations (iii) Network latency between users and cloud resources",["Only (i)","(i) and (ii)","(ii) and (iii)","(i), (ii), and (iii)"],3,"All three matter: the applications now depend on an external provider's SLAs, legal rules about data location, and network performance.",["Checking only SLAs ignores compliance and latency.","This ignores network latency.","This ignores the SLA guarantees."]],
[2,7,"In the traditional web services stack, which technology is used to describe a web service's interface — its operations, input/output messages, and how to invoke it?",["UDDI","WSDL","SMTP","HTML"],1,"WSDL is an XML-based language that describes a service's operations, message formats and binding details.",["UDDI is the registry used to discover services, not to describe them.","SMTP is an email transport protocol.","HTML is a markup language for web pages."]],
[2,8,"Traditional SOAP-based web services provide which of the following capabilities? (i) Platform-independent communication (ii) XML-based message exchange (iii) Automatic service discovery through UDDI (iv) Guaranteed microsecond-level response latency",["(i), (ii), and (iii)","(ii) and (iv)","Only (i)","All of the above"],0,"SOAP services give interoperability using XML and WSDL, and discovery through UDDI. They cannot promise microsecond latency because XML processing adds overhead.",["It includes (iv), which is false, and leaves out (i) and (iii).","It lists only (i), but (ii) and (iii) are also true.","It includes (iv), which is false."]],
[2,9,"Which of the following problems are effectively addressed by traditional web services, and which are NOT? (i) Passing through firewalls using standard HTTP/HTTPS (ii) Enabling interoperability across different programming languages and operating systems (iii) Ultra-low-latency, real-time inter-service communication (iv) Service discovery through registries like UDDI",["Only (i) and (ii) are addressed","(i), (ii), and (iv) are addressed; (iii) is NOT addressed","Only (ii) is addressed","All are addressed"],1,"HTTP/HTTPS, XML/SOAP/WSDL and UDDI cover (i), (ii) and (iv). XML parsing and SOAP overhead add delay, so (iii) is not addressed; gRPC suits real-time needs better.",["This misses (iv), which UDDI does address.","This misses (i) and (iv), which are also addressed.","This wrongly claims (iii) is addressed."]],
[2,10,"In the Service-Oriented Architecture (SOA) model, which set of operations correctly maps the interactions among the service provider, service registry, and service requestor?",["Publish (provider → registry), Find (requestor → registry), Bind (requestor → provider)","Publish (requestor → provider), Find (provider → registry), Bind (registry → requestor)","Bind (provider → registry), Publish (requestor → registry), Find (provider → requestor)","Find (provider → registry), Publish (requestor → registry), Bind (provider → provider)"],0,"The provider publishes its description to the registry, the requestor finds it there, then binds to the provider and invokes it directly.",["Here the roles are mixed up: the requestor does not publish to the provider.","Here the provider binds to the registry and the requestor publishes, which reverses their roles.","Here the requestor publishes and the provider binds to itself, which makes no sense."]],
[3,1,"Which of the following is least likely to be specified in an operational cloud Service Level Agreement (SLA)?",["Recovery Time Objective (RTO)","Exact encryption algorithm and key storage procedures","Mean Time To Repair (MTTR) for incidents","Penalty / credit calculation for downtime"],1,"An SLA states service-level commitments. Low-level security details such as exact algorithms and key storage belong in security or operational documents.",["RTO is a recovery commitment and is commonly stated in SLAs.","MTTR measures how fast incidents are fixed and is commonly stated.","Credits or penalties for downtime are a standard SLA term."]],
[3,2,"A multilevel SLA generally consists of which of the following levels? (i) Corporate Level (ii) Customer Level (iii) Service Level",["Only (i)","(i) and (ii)","(ii) and (iii)","(i), (ii), and (iii)"],3,"A multilevel SLA has corporate-level terms for all customers, customer-level terms for specific clients, and service-level terms for individual services.",["This leaves out the customer and service levels.","This leaves out the service level.","This leaves out the corporate level."]],
[3,3,"An enterprise signs a three-tier multilevel SLA with a cloud provider. However, the corporate-level SLA guarantees 95% uptime, the customer-level SLA specifies 98% uptime, and the service-level SLA guarantees 99.9% uptime. In case of a service disruption, which level of SLA is the provider LEGALLY BOUND to honor?",["Corporate-level SLA, as it's the broadest agreement","Customer-level SLA, as it's the middle ground","Service-level SLA, as it's the most specific agreement","The provider can choose the lowest applicable SLA"],2,"As given in the course answer key: the service-level SLA is the most specific to actual service delivery, so accountability lies there (99.9%).",["Being the broadest does not make the corporate level the binding one in this answer key.","Being the middle ground does not make the customer level the binding one.","The provider cannot choose the weakest commitment to escape its obligations."]],
[3,4,"Which pair of metrics is most directly used to quantify the reliability and recoverability commitments in a cloud SLA?",["Availability (uptime %) and Mean Time To Recovery (MTTR)","Lines of code and number of microservices","Number of employees and office locations","CPU clock speed and RAM size of the servers"],0,"Availability measures reliability and MTTR measures how quickly service is restored after an incident.",["Code size and microservice count are implementation details, not SLA commitments.","Staff numbers and offices are organizational facts, not service metrics.","Hardware specifications are low-level details, not SLA commitments."]],
[3,5,"A cloud service guarantees 99.9% availability per 30-day month. What is the maximum allowable downtime in that month under the SLA? (Assume 30 days = 720 hours.)",["About 0.72 hours","About 7.2 hours","About 3.6 hours","About 72 minutes"],0,"Allowed downtime = (1 − 0.999) × 720 = 0.72 hours, about 43 minutes.",["7.2 hours is 1% of 720, which matches 99%, not 99.9%.","3.6 hours is 0.5% of 720, which matches 99.5%.","72 minutes is 1.2 hours, more than the 0.72 hours allowed."]],
[3,6,"Which feature primarily enables a parallel database to process large analytical queries faster than a traditional database?",["Exclusive use of SQL","Distributed query execution across multiple computing nodes","Elimination of indexing","Storing all data in a single server"],1,"A parallel database partitions data and runs query operations on many nodes at the same time.",["SQL is only the query language; traditional databases use it too.","Removing indexing does not add parallelism.","One server is the traditional design, with no parallel speed-up."]],
[3,7,"You are building a fraud-detection pipeline that must flag suspicious transactions within a few hundred milliseconds as they arrive. The system must: ingest about 500,000 transactions per second; detect and alert within sub-second latency; apply per-transaction rules and short sliding-window aggregations. Which architectural choice is LEAST suitable?",["Apache Kafka feeding Apache Flink for continuous stream processing","Amazon Kinesis with a real-time stream-processing application","A nightly batch job on a data warehouse that scans the day's transactions","Apache Pulsar with a stream processor for windowed aggregation"],2,"A nightly batch job adds hours of delay and cannot give sub-second detection.",["Kafka with Flink is built for low-latency continuous processing, so it suits the need.","Kinesis with a real-time application handles streaming at this scale, so it suits the need.","Pulsar with a stream processor supports windowed aggregation, so it suits the need."]],
[3,8,"A company stores petabytes of satellite imagery that must be processed in parallel by Spark clusters. Which storage system is most suitable?",["Local SSD attached to a single virtual machine","Object storage such as Amazon S3 or Google Cloud Storage","Relational database server","Client-side browser cache"],1,"Cloud object storage scales almost without limit, is durable, and works directly with Spark and Hadoop.",["One VM's SSD is too small and cannot be shared across a cluster.","A relational server is not designed for petabytes of imagery.","A browser cache is temporary storage on a user's device."]],
[3,9,"A MapReduce job is designed to count word frequencies in 2 TB of text files. The mapper output is 1.5 TB (including overhead), and after the shuffle and sort phase, the data is 1.3 TB. During the reduce phase, a node runs out of disk space during the merge operation. Which of the following is the most likely cause and solution?",["The mapper logic is inefficient; rewrite the mapper function","The combiner phase didn't run; ensure combiner is explicitly configured to compress intermediate data locally","The shuffle and sort didn't deduplicate keys; increase the number of reducers","The network bandwidth is saturated; add more nodes to the cluster"],1,"A combiner pre-aggregates mapper output on each mapper node, shrinking the data before the shuffle so reducers do not run out of disk during the merge.",["Mapper logic affects correctness, not the volume reaching the reducers' disks.","Shuffle and sort is not meant to deduplicate keys; reducers group them.","Saturated bandwidth slows transfer; it does not fill a node's disk."]],
[3,10,"An OpenStack compute node contains 640 physical vCPUs. If the CPU allocation ratio is 5:1, what is the maximum number of virtual CPUs that may be allocated?",["3000","3200","3400","3500"],1,"Allocatable vCPUs = 640 × 5 = 3200.",["3000 is 640 × 4.69, not a 5:1 ratio.","3400 is more than 640 × 5.","3500 is more than 640 × 5."]],
[4,1,"Which Azure SQL Database service tier separates compute and storage so that storage can automatically grow up to 100 TB without requiring application downtime?",["Basic","Business Critical","Hyperscale","Standard"],2,"Hyperscale decouples compute from storage, so storage can scale to 100 TB, and it supports fast backup and restore.",["Basic is a small entry tier with limited size.","Business Critical focuses on high availability and low latency, not 100 TB decoupled storage.","Standard is a general tier without decoupled 100 TB storage."]],
[4,2,"One company deploys two Azure Virtual Machines in different Availability Zones within the same Azure region. One data center experiences a complete power outage. Which statement is correct?",["Both VMs will become unavailable because they are in the same region.","The second VM can continue running because Availability Zones are isolated from each other.","Azure automatically moves the failed VM to another region.","Both VMs share the same cooling and networking infrastructure."],1,"Availability Zones are separate data centers with independent power, cooling and networking, so the other zone keeps running.",["Being in the same region does not mean sharing one failure.","Azure does not automatically move a failed VM to another region.","Zones do not share cooling or networking; that is why they exist."]],
[4,3,"Which App Service pricing tier supports the highest number of deployment slots?",["Basic","Standard","Premium (P1v3 and higher)","Free"],2,"Premium supports up to 20 deployment slots, suited to advanced DevOps and CI/CD.",["Basic does not support deployment slots.","Standard supports far fewer slots than Premium.","Free does not support deployment slots."]],
[4,4,"An administrator notices that users can still access an Azure App Service website using http://. Which App Service configuration should be enabled to prevent unencrypted access?",["Managed Identity","Always On","HTTPS Only","Deployment Slots"],2,"HTTPS Only redirects every HTTP request to HTTPS, so traffic is encrypted.",["Managed Identity lets the app authenticate to other Azure services.","Always On keeps the app loaded and warm.","Deployment slots are staging environments for releases."]],
[4,5,"Which Google Cloud database service is designed specifically for structured relational data with global consistency and horizontal scalability?",["Firestore","Cloud SQL","Cloud Spanner","Memorystore"],2,"Cloud Spanner is a globally distributed relational database with SQL, horizontal scaling and strong consistency.",["Firestore is a NoSQL document database.","Cloud SQL scales mainly vertically and is not globally distributed.","Memorystore is an in-memory cache, not a relational database."]],
[4,6,"A virtual machine requires an additional 100 GB persistent disk that should remain intact even after the VM is terminated. Which OpenStack service manages this storage?",["Nova","Swift","Cinder","Keystone"],2,"Cinder provides persistent block storage that lives independently of the VM.",["Nova manages compute instances, not persistent disks.","Swift is object storage, not a block disk attached to a VM.","Keystone handles identity and authentication."]],
[4,7,"Which statement correctly distinguishes GKE from Cloud Run?",["GKE only supports virtual machines.","Cloud Run requires users to manage Kubernetes clusters.","GKE manages Kubernetes clusters, while Cloud Run executes containers without requiring cluster management.","Both services require manual Kubernetes control plane management."],2,"GKE is managed Kubernetes. Cloud Run is a serverless container platform where Google manages the infrastructure and scaling.",["GKE runs containers on Kubernetes, not only VMs.","Cloud Run hides clusters; users do not manage Kubernetes.","In both services Google manages the control plane."]],
[4,8,"A company collects millions of IoT sensor events every minute. The data must be ingested in real time, stored in a scalable analytical warehouse, and visualized through interactive dashboards. Which GCP architecture best satisfies these requirements?",["Cloud SQL + Cloud Functions + Looker","Pub/Sub + BigQuery + Looker Studio","Firestore + Compute Engine + Bigtable","Cloud Storage + Memorystore + App Engine"],1,"Pub/Sub ingests events in real time, BigQuery stores and queries petabyte-scale analytical data, and Looker Studio builds dashboards on it.",["Cloud SQL is not suited to high-volume analytics.","Firestore is operational NoSQL storage and this set has no analytical warehouse or dashboards.","Memorystore is a cache and this set has no warehouse or real-time ingestion service."]],
[4,9,"A DevOps engineer wants to route all production traffic to version v3 of an App Engine service. Which command is correct?",["gcloud app services set-traffic default --splits=v3=1","gcloud app deploy --traffic=v3","gcloud app versions promote v3","gcloud app services update v3"],0,"A traffic split of v3=1 sends 100% of traffic to version v3.",["gcloud app deploy has no --traffic=v3 option for this.","This is not the command for setting a traffic split.","This command does not exist in this form."]],
[4,10,"Which OpenStack service is primarily responsible for routing tenant traffic between internal and external networks?",["Nova","Neutron","Keystone","Swift"],1,"Neutron provides networking: virtual networks, routers, DHCP, security groups and floating IPs.",["Nova manages compute instances.","Keystone handles identity and authentication.","Swift is object storage."]],
[5,1,"A cloud provider guarantees 99% availability. A customer's application operates 12 hours per day. What is the maximum allowable downtime during a 30-day month without violating the SLA?",["3.6 hours","6 hours","7.2 hours","9 hours"],0,"Scheduled time = 12 × 30 = 360 hours. Allowed downtime = 1% of 360 = 3.6 hours.",["6 hours is about 1.7% of 360 hours, which breaks the 99% guarantee.","7.2 hours is 1% of 720 hours, which wrongly assumes the app runs 24 hours a day.","9 hours is 2.5% of 360 hours, which breaks the 99% guarantee."]],
[5,2,"A cloud server dynamically activates additional CPU cores to handle a sudden spike in user requests. What is the most likely impact on the server's power consumption?",["Power consumption decreases because the workload is distributed.","Power consumption remains unchanged since CPU frequency is fixed.","Power consumption increases as additional CPU cores become active.","Power consumption depends only on the amount of RAM used."],2,"Each active core draws power, so total consumption generally rises. DVFS can improve efficiency but does not remove this.",["Spreading work across more cores does not lower total power; more cores are now running.","Fixed frequency does not matter; extra active cores still use extra power.","CPU activity affects power too, not only RAM."]],
[5,3,"Which cloud characteristic most directly helps organizations avoid large upfront hardware investments?",["Elastic scalability","Pay-as-you-go pricing","Fault tolerance","Multi-tenancy"],1,"With pay-as-you-go pricing, customers pay only for what they consume, so no big hardware purchase is needed up front.",["Elasticity adjusts capacity to demand; it is not the pricing model that removes upfront cost.","Fault tolerance keeps services running through failures.","Multi-tenancy means many customers share resources; it is not the billing model."]],
[5,4,"An HDFS cluster has a block size of 128 MB. A 700 MB input file is processed using MapReduce. Assuming one map task per HDFS block, how many map tasks are created?",["5","6","7","8"],1,"700 MB = 5 full blocks of 128 MB + 1 partial block of 60 MB = 6 blocks, so 6 map tasks.",["5 ignores the final partial block of 60 MB, which still needs a task.","7 counts one block too many; 700 ÷ 128 is 5.47, rounded up to 6.","8 counts two blocks too many."]],
[5,5,"Which virtualization component is primarily responsible for creating and managing virtual machines?",["Operating System Kernel","Hypervisor","BIOS","Device Driver"],1,"The hypervisor (Virtual Machine Monitor) creates, runs and manages VMs by abstracting the physical hardware.",["The OS kernel manages processes on one OS; it does not create VMs.","The BIOS starts the hardware at boot.","A device driver lets the OS talk to one hardware device."]],
[5,6,"Which MapReduce component determines which Reducer receives a particular key?",["Combiner","Partitioner","RecordWriter","InputSplit"],1,"The Partitioner decides the destination reducer for each intermediate key; by default Hadoop uses a hash-based partitioner.",["The Combiner pre-aggregates mapper output locally; it does not route keys.","RecordWriter writes the final output records.","InputSplit defines the chunk of input a mapper reads."]],
[5,7,"Which MapReduce component is optional and may execute zero, one, or multiple times?",["Mapper","Reducer","Combiner","RecordReader"],2,"The Combiner is an optional optimization and Hadoop does not guarantee it will run, so the algorithm must stay correct without it.",["The Mapper is a required stage.","The Reducer is a required stage for jobs that aggregate.","The RecordReader always runs to turn input splits into key-value pairs."]],
[5,8,"A cloud provider observes that many physical servers are running at only 15% CPU utilization. To reduce electricity costs, it migrates virtual machines onto fewer servers and powers off the idle hosts while ensuring that application performance remains within SLA limits. Which scheduling strategy is being applied?",["Round-Robin Scheduling","Energy-Aware Scheduling","First-Come-First-Serve Scheduling","Fair Scheduling"],1,"Energy-aware scheduling consolidates workloads onto fewer machines so idle ones can be switched off while the required QoS is kept.",["Round-robin hands out tasks in turn and spreads load, which does not power servers off.","FCFS only orders tasks by arrival time.","Fair scheduling divides resources evenly between users, not to save energy."]],
[5,9,"Statement 1: Elasticity enables cloud users to increase or decrease resources according to workload demand. Statement 2: Elasticity helps organizations avoid paying for unused computing resources.",["Both statements are true.","Both statements are false.","Statement 1 is true and Statement 2 is false.","Statement 1 is false and Statement 2 is true."],0,"Elasticity scales resources up and down with demand, and releasing them when demand drops means no payment for idle infrastructure.",["Both statements are true, so \"both false\" is wrong.","Statement 2 is also true, since released resources are no longer billed.","Statement 1 is also true; that is the definition of elasticity."]],
[5,10,"Average demand = 75 units, Peak demand = 225 units. The cloud provider offers a utility premium of 2.8. Which statement is true?",["Cloud cost < Owning cost","Cloud cost > Owning cost","Both costs are equal","None of the above"],0,"The break-even premium is peak ÷ average = 225 ÷ 75 = 3. Since 2.8 is below 3, the cloud is cheaper.",["The cloud would be dearer only if the premium were above 3.","The costs would be equal only if the premium were exactly 3.","A correct statement exists, so \"none\" is wrong."]],
[6,1,"A database stores customer records in encrypted form. However, an administrator accidentally changes several account balances due to a software bug. Which security objective has failed?",["Confidentiality only","Integrity only","Availability only","Confidentiality and Availability"],1,"Encryption protects confidentiality but cannot stop wrong modification by authorized users or software. Wrongly changed data is an integrity failure.",["The data stayed encrypted, so confidentiality did not fail.","The data was still accessible, so availability did not fail.","Neither confidentiality nor availability was lost here."]],
[6,2,"An employee logs into a fake VPN portal that perfectly imitates the company's official login page. Before any credentials are entered, which security property has already been compromised?",["Confidentiality","Integrity","Availability","Authenticity"],3,"The fake portal falsely claims to be the real VPN service, so authenticity is broken before anything is disclosed.",["No confidential data has been disclosed yet.","No data has been altered yet.","The real service is still up; nothing has been made unavailable."]],
[6,3,"Which of the following attacks is NOT considered a passive attack?",["Packet sniffing","Traffic analysis","Session hijacking","Network monitoring"],2,"Session hijacking takes over a live session by injecting or modifying packets, which is an active attack.",["Packet sniffing only observes traffic, so it is passive.","Traffic analysis only observes traffic patterns, so it is passive.","Network monitoring only observes, so it is passive."]],
[6,4,"Which of the following attacks cannot directly modify the contents of transmitted data?",["Replay attack","Man-in-the-Middle attack","Eavesdropping","Masquerading"],2,"Eavesdropping only captures data in transit and does not alter or inject messages, so it is passive.",["A replay attack resends captured messages, which is an active interference.","A man-in-the-middle can intercept and alter messages.","Masquerading means acting as someone else to send or alter traffic."]],
[6,5,"Which of the following best describes a Denial-of-Service (DoS) attack?",["An attacker secretly monitors network traffic without modifying it.","An attacker floods a server with excessive requests, making the service unavailable to legitimate users.","An attacker impersonates a legitimate user to gain unauthorized access.","An attacker modifies data during transmission between two communicating parties."],1,"DoS is an active attack that overwhelms a service with requests so legitimate users cannot use it.",["That describes passive monitoring or eavesdropping.","That describes masquerading.","That describes a man-in-the-middle or modification attack."]],
[6,6,"Which of the following activities is least likely to be considered part of the reconnaissance phase?",["Performing DNS enumeration to identify subdomains","Scanning the target to discover open ports and running services","Exploiting a buffer overflow vulnerability to gain administrator privileges","Searching public websites and social media for organizational information"],2,"Exploiting a vulnerability belongs to the attack (exploitation) phase, not information gathering.",["DNS enumeration gathers information, so it is reconnaissance.","Port scanning gathers information about the target, so it is reconnaissance.","Searching public sources (OSINT) is reconnaissance."]],
[6,7,"Statement I: Authentication determines whether a user is allowed to access a resource. Statement II: Authorization determines what actions an authenticated user is permitted to perform.",["Statement I is TRUE and Statement II is FALSE.","Statement I is FALSE and Statement II is TRUE.","Both statements are TRUE.","Both statements are FALSE."],1,"Authentication verifies who the user is; authorization decides what that user may do. Statement I describes authorization, so it is false; Statement II is true.",["Statement II is true, and Statement I mixes up authentication with authorization.","Statement I is not true, since it describes authorization.","Statement II is true, so \"both false\" is wrong."]],
[6,8,"A financial institution must install a custom Linux kernel module, configure firewall rules at the operating system level, and deploy proprietary database software. However, it does not want to purchase or maintain physical servers. Which cloud service model is most appropriate?",["SaaS","PaaS","IaaS","FaaS"],2,"IaaS gives control of the OS and installed software while the provider handles the physical servers.",["SaaS offers a finished application with no OS control.","PaaS manages the OS and runtime, so a custom kernel module is not possible.","FaaS runs small functions with no OS control."]],
[6,9,"An organization discovers that backups of its confidential data are automatically replicated to another country without its knowledge. Which cloud security concern has been violated?",["Data Location","Recovery","Virtualization","Resource Pooling"],0,"Automatic replication across regions can break legal or organizational rules about where sensitive data may be stored.",["Recovery is about restoring data after failure; the issue is where the copies are.","Virtualization concerns isolation of VMs on shared hardware.","Resource pooling is the sharing of resources among customers."]],
[6,10,"Which of the following cloud design practices is most effective in reducing vendor lock-in?",["Using provider-specific APIs whenever possible","Developing applications using open standards and portable technologies","Storing data only in proprietary database formats","Relying exclusively on managed proprietary services"],1,"Open standards, containers and portable technologies reduce dependence on one provider and make migration easier.",["Provider-specific APIs tie the application to that provider.","Proprietary formats make moving data hard.","Exclusive use of proprietary services increases lock-in."]],
[7,1,"Which of the following applications is least suitable for computation offloading to a remote cloud in Mobile Cloud Computing (MCC)?",["Image rendering requiring intensive GPU computation","Large-scale machine learning inference","Emergency collision avoidance requiring millisecond response","Video transcoding"],2,"Safety-critical, real-time tasks need very low latency. Network delay and connectivity uncertainty make a remote cloud unsuitable; they belong on the device or on nearby edge/fog nodes.",["Heavy GPU rendering is compute-intensive and tolerates some delay, so it suits offloading.","Large-scale ML inference is compute-intensive, so it suits offloading.","Video transcoding is heavy and not millisecond-critical, so it suits offloading."]],
[7,2,"A cloud-based mobile application automatically allocates additional computing resources during a sudden surge in users and releases them when demand decreases. Which cloud characteristic is demonstrated?",["Resource pooling","Rapid elasticity","Location independence","Broad network access"],1,"Rapid elasticity scales resources up or down automatically with workload.",["Resource pooling is about sharing one pool among many customers.","Location independence means the user does not control or know the resource's location.","Broad network access means services are reachable over standard networks from many devices."]],
[7,3,"Dynamic computation offloading primarily aims to optimize which combination of objectives?",["Screen brightness and storage capacity","Execution time, energy consumption, and resource utilization","Camera quality and display refresh rate","Cloud subscription cost only"],1,"Dynamic offloading balances execution delay, battery use, CPU utilization and network conditions.",["Screen brightness and storage are not what offloading decisions optimize.","Camera quality and refresh rate are hardware features, not offloading goals.","Cost matters, but it is not the only objective; time and energy count too."]],
[7,4,"A mobile augmented reality application requires object recognition with an end-to-end response time below 20 ms. Which infrastructure is most appropriate?",["A geographically distant public cloud data center","A nearby cloudlet connected through a high-speed local network","Local storage only","An offline mobile application"],1,"AR is highly latency-sensitive. A nearby cloudlet gives compute close to the user with minimal delay.",["A distant data center adds too much network delay for 20 ms.","Storage alone provides no computing power for recognition.","An offline app lacks the compute for heavy object recognition."]],
[7,5,"A healthcare application stores patient records in the cloud. Which security requirement is most critical to ensure that unauthorized users cannot access sensitive medical information?",["Elasticity","Data confidentiality","Resource pooling","Load balancing"],1,"Confidentiality ensures only authorized people can read the data.",["Elasticity concerns scaling, not access control.","Resource pooling is a sharing model, not a protection for data.","Load balancing spreads traffic; it does not restrict who sees records."]],
[7,6,"Which limitation of traditional cloud computing is primarily addressed by fog computing?",["Limited virtualization support","High network latency caused by distant cloud data centers","Lack of cloud storage","Insufficient computing power in cloud servers"],1,"Fog places compute closer to end devices, cutting the delay of sending data to a distant data center.",["Clouds already have strong virtualization.","Clouds offer plenty of storage.","Cloud servers have abundant computing power; distance is the problem."]],
[7,7,"Which statement about fog nodes is FALSE?",["They may perform filtering and aggregation of sensor data.","They are usually located close to IoT devices.","They permanently store all enterprise data.","They reduce communication with distant cloud servers."],2,"Fog nodes do temporary processing and short-term storage; long-term storage is mostly in cloud data centers. So this statement is false.",["True: fog nodes filter and aggregate sensor data.","True: fog nodes sit near IoT devices.","True: by processing locally, fog nodes cut traffic to the cloud."]],
[7,8,"Statement 1: Geospatial Cloud Computing enables parallel processing of massive satellite imagery by distributing computation across multiple cloud nodes. Statement 2: Distributed storage and parallel processing frameworks reduce execution time for large geospatial datasets compared with a single desktop workstation.",["Both Statement 1 and Statement 2 are true, and Statement 2 is the correct explanation of Statement 1","Both Statement 1 and Statement 2 are true, but Statement 2 is not the correct explanation of Statement 1","Statement 1 is true, but Statement 2 is false","Statement 1 is false, but Statement 2 is true"],0,"Both are true, and distributed storage with parallel computation is exactly why clouds process huge geospatial datasets efficiently.",["Statement 2 does explain Statement 1, so \"not the explanation\" is wrong.","Statement 2 is true, so it cannot be false.","Statement 1 is true, so it cannot be false."]],
[7,9,"A cloud platform divides a large raster image into tiles for parallel processing. Which challenge must be carefully addressed to ensure accurate results?",["Screen resolution of client devices","Boundary effects between adjacent image tiles","Keyboard input latency","Number of GIS users"],1,"Filtering, convolution and terrain analysis need neighbouring pixels. Tiles can cause errors at their edges unless overlap or edge handling is used.",["Client screen resolution does not affect the processing result.","Keyboard latency is unrelated to tile processing.","The number of users affects load, not accuracy of tiled results."]],
[7,10,"A wearable ECG sensor continuously streams a patient's heart signals. Which architecture is most appropriate to detect cardiac abnormalities within a few milliseconds?",["IoT sensors → Remote Cloud → Physician","IoT sensors → Fog/Edge Node → Cloud","IoT sensors → Local Storage → Weekly Upload","IoT sensors → FTP Server → Desktop GIS"],1,"Delay-sensitive healthcare needs immediate processing at a nearby fog/edge node; the cloud handles long-term storage, analysis and model training.",["A remote cloud adds too much delay for millisecond detection.","A weekly upload is far too slow for detection.","An FTP server and desktop GIS are not real-time health-monitoring tools."]],
[8,1,"Which command is used to remove a Docker image that is no longer required?",["docker rm","docker rmi","docker delete","docker remove"],1,"docker rmi removes one or more images from the local system.",["docker rm removes containers, not images.","docker delete is not a Docker command for this.","docker remove is not the correct command for images."]],
[8,2,"Which Docker command is primarily used to list all available Docker networks?",["docker network ls","docker network show","docker net ps","docker networks"],0,"docker network ls lists the networks with ID, name, driver and scope.",["docker network show is not a valid listing command.","docker net ps is not a valid command.","docker networks is not a valid command."]],
[8,3,"Which of the following is the most accurate comparison between VMs and containers?",["VMs share the host kernel, while containers have separate kernels","Containers generally share the host kernel, while VMs virtualize hardware and run separate guest OS kernels","Both always require separate guest operating systems","Containers require more resources than VMs because they include a complete OS"],1,"Containers isolate applications at the OS level and share the host kernel; a VM runs its own guest OS on virtualized hardware.",["This swaps the two: VMs have their own kernels and containers share.","Containers do not need a separate guest OS.","Containers are generally lighter than VMs, not heavier."]],
[8,4,"What is the primary role of etcd in a Kubernetes cluster?",["Running application containers","Storing Kubernetes cluster state and configuration data","Scheduling Pods onto Nodes","Providing container images"],1,"etcd is a distributed key-value store holding cluster state, configuration and metadata for the control plane.",["Containers run on worker nodes through the container runtime.","Scheduling is done by the kube-scheduler.","Images come from a container registry."]],
[8,5,"Which of the following is an example of a Type 2 (hosted) hypervisor?",["VMware ESXi","Xen","Oracle VirtualBox","Microsoft Hyper-V Server"],2,"VirtualBox runs as an application on top of an existing host OS, which makes it Type 2.",["ESXi runs directly on hardware (Type 1).","Xen runs directly on hardware (Type 1).","Hyper-V Server runs directly on hardware (Type 1)."]],
[8,6,"A cloud data center has 100 physical servers, but only 40 are heavily utilized while the remaining servers operate at very low utilization. Which strategy would MOST effectively reduce energy consumption?",["Distribute VMs equally across all 100 servers","Consolidate VMs onto fewer servers and switch idle servers to a low-power state","Increase CPU frequency on all servers","Duplicate every VM across multiple servers"],1,"Consolidating VMs onto fewer servers lets the idle ones sleep or power off, cutting energy use.",["Spreading VMs over all servers keeps every server powered on.","Higher CPU frequency raises power use.","Duplicating VMs adds load and power use."]],
[8,7,"In a Sensor Cloud environment, why is a middleware layer often required between Wireless Sensor Networks (WSNs) and cloud services?",["To increase the physical size of sensor nodes","To abstract heterogeneous sensors and provide cloud-accessible sensor resources","To eliminate all communication between sensors","To replace the sensing function of WSN nodes"],1,"Middleware hides differences between resource-constrained sensors and handles discovery, data collection, protocol translation and service management for the cloud.",["Middleware is software; it does not change physical size.","Sensors still need to communicate; middleware does not remove that.","Sensors still do the sensing; middleware does not replace them."]],
[8,8,"Which architecture is generally BEST suited for applications requiring both low latency and large-scale cloud analytics?",["IoT Device → Cloud only","IoT Device → Edge/Fog → Cloud","IoT Device → Database only","IoT Device → Hypervisor → Cloud"],1,"Edge/fog nodes handle latency-sensitive work locally, while the cloud provides large-scale storage, history analysis and heavy computation.",["Cloud-only has higher latency from distance.","A database alone provides neither local processing nor large-scale analytics.","A hypervisor is virtualization software, not a latency-reducing layer."]],
[8,9,"An IoT application sends sensitive sensor data through public networks to a cloud platform. Which mechanism is MOST important for protecting the data during transmission?",["Data encryption","Increasing CPU frequency","Increasing sensor sampling rate","VM consolidation"],0,"Encryption (for example TLS) stops unauthorized parties from reading or modifying data in transit.",["CPU frequency affects speed, not data protection.","Sampling rate changes how much data is collected, not its security.","VM consolidation saves energy; it does not protect data."]],
[8,10,"Statement 1: Processing latency-sensitive IoT workloads at an edge node can reduce the communication delay associated with a distant cloud. Statement 2: Edge processing eliminates all network latency because no communication is required.",["Statement 1 is True and Statement 2 is False","Statement 2 is True and Statement 1 is False","Both statements are True","Both statements are False"],0,"Edge moves processing closer to the data and reduces delay, but some communication latency remains, so Statement 2 is false.",["Statement 2 is false, since some latency always remains.","Statement 2 is false, so \"both true\" is wrong.","Statement 1 is true, so \"both false\" is wrong."]],
[9,1,"A factory requires machine-level anomaly detection within milliseconds, but it also needs to aggregate data from multiple machines for plant-wide analysis before sending summaries to the cloud. Which placement BEST matches the requirements?",["All processing in the centralized cloud","Machine-level processing at the edge and plant-level processing at fog nodes","All processing directly on individual sensors","Plant-wide processing exclusively at the cloud"],1,"Edge handles the millisecond-level work next to each machine; fog nodes aggregate across machines and send summaries to the cloud.",["Cloud-only is too far away for millisecond detection.","Sensors alone cannot combine data across machines for plant-wide analysis.","The brief wants summaries sent to the cloud after plant-level aggregation, not raw plant-wide processing there."]],
[9,2,"A smart-city traffic system receives video streams from hundreds of cameras. Immediate object detection is performed near each camera, regional congestion patterns are analyzed at roadside micro-data centers, and long-term traffic trends are analyzed in the cloud. Which architecture BEST represents this system?",["Cloud-only architecture","Fog-only architecture","Edge–Fog–Cloud architecture","Edge-only architecture"],2,"It uses edge for immediate detection, fog for regional analysis and the cloud for long-term trends: all three layers.",["The system clearly uses processing outside the cloud.","It also uses edge and cloud, not only fog.","It also uses fog and cloud, not only edge."]],
[9,3,"An IoT system performs local filtering before forwarding data to the cloud. Which ordering BEST represents the typical amount of raw data transmitted toward centralized cloud infrastructure, from lowest to highest?",["Edge processing → Fog processing → Cloud-only processing","Cloud-only processing → Fog processing → Edge processing","Fog processing → Cloud-only processing → Edge processing","Edge processing → Cloud-only processing → Fog processing"],0,"Edge filters data first (least sent), fog aggregates regionally (more), and cloud-only sends all raw data (most).",["This order is reversed: cloud-only sends the most.","Edge filtering sends less than cloud-only, so edge cannot come last.","Fog aggregation sends less than cloud-only, so fog cannot come last."]],
[9,4,"A fog node is running out of memory, but the infrastructure allows additional RAM and CPU resources to be assigned to that same node. Which scalability approach is being used?",["Horizontal scalability","Temporal scalability","Geographic scalability","Vertical scalability"],3,"Vertical scalability (scale-up) adds resources such as CPU and RAM to an existing node.",["Horizontal scalability adds more nodes instead.","Temporal scalability is not the term for adding resources to a node.","Geographic scalability is about spreading across locations."]],
[9,5,"Which statement BEST describes the division of responsibilities in a hierarchical Edge–Fog–Cloud architecture?",["Edge handles global optimization, while Cloud handles sensor-level decisions","Edge handles immediate local actions, Fog coordinates regional resources, and Cloud performs global orchestration","All three layers perform exactly the same tasks","Only the Cloud is allowed to make decisions"],1,"Decisions are split by proximity and scope: edge acts locally, fog coordinates regionally, and the cloud sets global policy and long-term analytics.",["This swaps the roles of edge and cloud.","The layers exist because they do different jobs.","Edge and fog also make decisions."]],
[9,6,"A video analytics application requires its first-stage processing to occur within 10 ms of the camera, while its model-training component requires substantial computational resources. Which placement is MOST appropriate?",["Both components on a distant cloud server","Both components on the smallest IoT device","First-stage processing at the edge and model training in the cloud","First-stage processing only in the cloud and training at the edge"],2,"The 10 ms stage must be next to the camera (edge); heavy model training belongs where compute is plentiful (cloud).",["A distant cloud cannot meet 10 ms for the first stage.","The smallest IoT device lacks the power for model training.","This reverses the placement: the cloud is too far for 10 ms, and the edge is too weak for training."]],
[9,7,"A mobile device is moving rapidly between coverage areas of different edge servers while executing an offloaded task. Which issue becomes MOST critical?",["Static CPU allocation","Service migration and task continuity during handover","Cloud storage capacity","VM image size only"],1,"As the device changes coverage areas, the task may need migrating or reassigning with minimal interruption and overhead.",["CPU allocation is not the main problem when moving between servers.","Cloud storage is not what breaks during movement.","Image size is only one factor; continuity during handover is the key issue."]],
[9,8,"A cloud application requires additional resources because its primary CSP has insufficient capacity. A broker identifies a suitable secondary CSP and negotiates the required service conditions. Which cloud-federation function is being performed?",["Resource federation and inter-provider service provisioning","VM deletion within a single CSP","Local container orchestration","Hardware virtualization"],0,"A federation broker discovers resources across several providers and coordinates provisioning between them.",["Nothing is being deleted, and a second provider is involved.","Orchestrating containers happens inside one environment, not across providers.","Hardware virtualization is a single-host technology, not a provider-to-provider function."]],
[9,9,"Why is trust management particularly important in a cloud federation?",["Resources and services may be obtained from independent providers with different security and reliability policies","All CSPs are automatically controlled by the same organization","Federation eliminates authentication requirements","Trust is required only for physical servers"],0,"Federated CSPs are independent, with different security, compliance and reliability, so trust must be built and verified.",["CSPs in a federation are independent, not controlled by one organization.","Federation does not remove authentication; it makes it more important.","Trust applies to services, data and providers, not only physical servers."]],
[9,10,"Which is the PRIMARY advantage of a Hybrid Cloud Federation for an organization handling sensitive workloads?",["It eliminates the need for security controls","It forces all workloads into the public cloud","It combines private-cloud control for sensitive workloads with public-cloud scalability","It prevents workload migration between environments"],2,"Sensitive workloads stay in private infrastructure while less-sensitive or burst workloads use public-cloud capacity.",["Security controls are still needed.","Hybrid does not force everything into the public cloud.","Hybrid allows workloads to move between environments."]],
[10,1,"During live migration of a VM, which condition is most likely to increase the total migration time?",["Low rate of memory-page modification by the VM","High rate of memory-page modification during migration","Increasing the number of CPU cores on the destination host","Reducing the VM memory size"],1,"Pages modified during copying become dirty and must be sent again, so a high modification rate means more data and a longer migration.",["Few modified pages means little re-copying, so migration is faster.","More destination cores do not reduce the data to be sent.","A smaller memory means less data to transfer."]],
[10,2,"Which live VM migration technique starts the VM on the destination first and then fetches memory pages from the source on demand as they are accessed?",["Cold migration","Pre-copy migration","Post-copy migration","Offline image transfer"],2,"Post-copy resumes the VM at the destination right away and pulls pages from the source on demand (page faults) or by background pushing.",["Cold migration stops the VM first and moves it.","Pre-copy transfers memory before switching over.","Offline transfer also needs the VM stopped."]],
[10,3,"Which technique is most likely to reduce the total data transferred (and hence the energy used) during pre-copy live migration?",["Increasing the memory-dirtying rate of the workload","Compressing and deduplicating memory pages before transfer","Adding more iterative pre-copy rounds indefinitely","Disabling dirty-page tracking"],1,"Compression and deduplication shrink the data sent, saving time and energy.",["A higher dirtying rate means more retransmission.","Unlimited extra rounds waste bandwidth.","Without dirty-page tracking, pre-copy cannot be correct."]],
[10,4,"Which resource management strategy is most important to prevent overload when many edge devices send data to nearby fog nodes?",["Increasing storage capacity at a single fog node","Static task allocation","Load balancing across fog nodes","Sending all data directly to the cloud"],2,"Load balancing spreads tasks over several fog nodes, avoiding congestion and keeping latency low.",["More storage on one node does not fix its processing overload.","Static allocation cannot adapt to changing load.","Sending everything to the cloud adds delay and bandwidth use, defeating fog's purpose."]],
[10,5,"A Kubernetes cluster has several worker nodes. A newly created Pod must be assigned to an appropriate node based on available resources and scheduling constraints. Which Kubernetes component is primarily responsible for this decision?",["kubelet","kube-scheduler","kube-proxy","Container registry"],1,"The kube-scheduler picks a node by looking at resource needs, availability, affinity rules and constraints.",["The kubelet manages Pods on a node after the choice is made.","kube-proxy handles networking rules for services.","A container registry stores images."]],
[10,6,"Consider the following Docker workflow: Dockerfile → docker build → ______ → docker run. Which entity is produced by the docker build operation?",["Docker volume","Docker image","Running container","Kubernetes Pod"],1,"docker build reads the Dockerfile and creates an image; docker run later creates a container from it.",["A volume is storage created separately.","A running container comes from docker run, not docker build.","A Pod is a Kubernetes object, not a Docker build output."]],
[10,7,"Which of the following correctly describes the roles of Linux namespaces and cgroups in containers?",["Namespaces provide resource quotas, while cgroups provide process isolation.","Namespaces provide isolation of processes and system resources, while cgroups control resource usage.","Both namespaces and cgroups are used only to create Docker images.","Neither is required for container isolation."],1,"Namespaces give separate views of process IDs, networking and mounts; cgroups limit and monitor CPU, memory and other resources.",["This swaps the roles of namespaces and cgroups.","They run containers; they do not build images.","Both are core to container isolation and resource control."]],
[10,8,"A VM has 32 GB of memory and the migration link provides 16 MB/sec of usable throughput. For a non-live (cold) migration where the entire memory is transferred once, what is the approximate transfer time? (Use 1 GB = 2^30 bytes, 1 MB = 2^20 bytes.)",["About 15 minutes","About 34 minutes","About 1 hour","About 2 hours"],1,"Time = (32 × 1024 MB) ÷ 16 MB/s = 2048 s, about 34 minutes.",["15 minutes (900 s) would need about 36 MB/s.","1 hour (3600 s) would need about 9 MB/s.","2 hours (7200 s) would need about 4.6 MB/s."]],
[10,9,"A database container is deleted accidentally. The database files were stored using a Docker named volume rather than only inside the container's writable layer. What happens to the data?",["The data is automatically deleted with the container.","The data remains available in the named volume.","The data is converted into a Docker image.","The data can only be recovered by restarting the deleted container."],1,"A volume has a lifecycle independent of containers, so deleting the container does not delete its data.",["Data in the container's writable layer is lost, but named volumes persist.","Volume data is never turned into an image.","The container is gone, but the volume can be attached to a new one."]],
[10,10,"Which of the following statements about containers and virtual machines is CORRECT?",["Containers normally require a separate complete guest operating system for every application.","Virtual machines and containers always provide identical levels of isolation.","Containers generally share the host operating system kernel, whereas VMs virtualize a complete machine environment.","Containers cannot be deployed on virtual machines."],2,"Containers share the host kernel, so they are lighter and start faster; a VM virtualizes hardware and runs its own guest OS.",["Containers do not need a guest OS each.","VMs generally isolate more strongly than containers.","Containers can run inside VMs."]],
[11,1,"Which capability is the defining feature of Dew computing compared to conventional cloud computing?",["It requires a permanent high-bandwidth connection to the cloud","It provides local independence, letting a device store and process data offline and sync with the cloud when connectivity returns","It eliminates the need for any cloud component","It performs only data storage and never computation"],1,"Dew computing gives local independence: devices keep working offline and reconcile with the cloud once reconnected.",["This is the opposite: dew computing works without a permanent connection.","Dew computing complements the cloud; it does not replace it.","Dew devices do both storage and computation."]],
[11,2,"A weather-monitoring device installed in a remote mountain region must continue recording and processing measurements for several hours even when the Internet connection is unavailable. Once connectivity is restored, the accumulated data is synchronized with a cloud server. Which computing paradigm best matches this requirement?",["Edge computing","Fog computing","Dew computing","Centralized cloud computing"],2,"Dew computing stresses autonomous operation at or near the device, with later synchronization to the cloud.",["Edge computing processes near the source but does not stress offline operation with later sync.","Fog computing uses nearby intermediate nodes that still need network connectivity.","A centralized cloud cannot work while the Internet connection is down."]],
[11,3,"Two users modify the same record independently while their devices are offline. When both devices reconnect, the cloud detects that the two versions conflict. Which mechanism is most directly required to handle this situation?",["CPU scheduling","Conflict detection and resolution during synchronization","Container image creation","Load balancing"],1,"Offline edits create conflicting versions, so the system must detect the conflict and apply a resolution policy to restore a consistent state.",["CPU scheduling decides which process runs, not which data version wins.","Creating container images is unrelated to data conflicts.","Load balancing spreads requests; it does not merge versions."]],
[11,4,"Allowing Dew devices to operate offline and modify data independently most directly introduces which challenge?",["Increased CPU virtualization overhead","The need to detect and resolve data conflicts when devices reconnect and synchronize","Permanent loss of all local data","Inability to ever reach the cloud"],1,"Independent offline changes let copies diverge, so consistency must be restored at sync: the autonomy-versus-consistency trade-off.",["Offline operation does not add virtualization overhead.","Local data is kept and synchronized later, not lost.","Devices can reach the cloud when connectivity returns."]],
[11,5,"A serverless function has not been invoked for a long period. When the next request arrives, the platform requires additional time to initialize the execution environment. This delay is known as:",["Warm start","Cold start","Cache miss","Bootstrapping failure"],1,"A cold start happens when the platform has to create or initialize a new execution environment before running the request, which adds latency.",["A warm start reuses an environment that is already ready, so there is no extra delay.","A cache miss concerns missing cached data, not environment setup.","Bootstrapping failure is not the term for this delay, and nothing has failed."]],
[11,6,"Why are serverless functions typically designed to be stateless?",["To reduce electricity consumption","Because local storage is unlimited","To allow automatic scaling and parallel execution without dependency conflicts","To avoid using APIs"],2,"Stateless invocations are independent, so the platform can run many instances in parallel and scale horizontally without coordination issues.",["Saving electricity is not the design reason.","Local storage in functions is limited and temporary.","Serverless functions use APIs freely."]],
[11,7,"A team wants to run a batch job that takes about 45 minutes to complete in a single AWS Lambda invocation. Why is this NOT feasible?",["Lambda has no internet access","Lambda enforces a maximum execution timeout of 15 minutes per invocation","Lambda cannot process batch data","Lambda functions must always be stateful"],1,"A single Lambda invocation is capped at 15 minutes (900 seconds). A 45-minute job must be split up or run on containers, AWS Batch or EC2.",["Lambda can have internet access.","Lambda can process batch data in smaller pieces.","Lambda functions are designed to be stateless, not stateful."]],
[11,8,"A serverless application receives 1,000 independent requests simultaneously. The provider can create multiple function instances to process these requests concurrently. Which property of serverless computing makes this possible?",["Stateful execution","Horizontal scalability of independent function invocations","Fixed allocation of one VM per user","Permanent local storage"],1,"Independent invocations let the platform automatically add function instances as demand rises, so many run in parallel.",["Stateful execution would make parallel copies depend on each other.","A fixed VM per user does not scale to 1,000 simultaneous requests.","Permanent local storage is not a serverless property and does not enable concurrency."]],
[11,9,"A research group wants to execute a scientific computation that requires 40 minutes of uninterrupted execution for each task. The chosen FaaS platform imposes a maximum execution time of 15 minutes per invocation. What is the primary problem with using this platform directly?",["Functions cannot communicate with databases.","The execution time exceeds the platform's maximum invocation duration.","FaaS cannot process numerical calculations.","Serverless functions cannot execute in parallel."],1,"Each invocation has a time limit, and a 40-minute task cannot finish within a 15-minute limit.",["Functions can communicate with databases.","FaaS can run numerical calculations.","Serverless functions can run in parallel."]],
[11,10,"A company needs a managed cloud platform specifically designed for large-scale analytical queries over structured datasets, using distributed processing rather than relying on a single database server. Which service is most appropriate?",["Amazon Redshift","Amazon EC2","AWS Lambda","Amazon Route 53"],0,"Redshift is a managed cloud data warehouse built for large-scale analytics, using distributed, column-oriented query processing.",["EC2 gives raw virtual machines, not a managed analytics platform.","Lambda runs short functions, not large analytical queries.","Route 53 is a DNS service."]],
[12,1,"Mobile Cloud Computing (MCC) benefits mobile devices by: 1. Offloading compute-intensive tasks to the cloud 2. Extending effective battery life by reducing on-device processing 3. Guaranteeing zero network latency 4. Providing access to large-scale storage",["1, 2, and 4 only","1 and 3 only","2 and 3 only","All of the above"],0,"MCC offloads heavy work (1), which saves battery (2), and gives access to scalable storage (4). It cannot guarantee zero latency (3), since wireless communication always adds delay.",["This includes the false statement 3 and leaves out 2 and 4.","This includes the false statement 3.","This includes the false statement 3, so \"all\" is wrong."]],
[12,2,"A city planning department stores road networks, building locations, GPS coordinates, and satellite images in a cloud-based system for analysis. This is primarily an example of:",["Mobile Cloud Computing","Spatial Cloud Computing","Serverless Computing","Batch Computing"],1,"Spatial cloud computing manages and processes geospatial data: coordinates, maps, GIS layers and satellite imagery.",["Mobile cloud computing is about mobile devices using the cloud.","Serverless computing is about running functions without managing servers.","Batch computing is about processing jobs in groups, not about spatial data."]],
[12,3,"Which task is MOST likely to rely on Spatial Cloud Computing?",["Sorting a company's payroll spreadsheet","Real-time flood-risk mapping using terrain and rainfall data across a region","Compiling source code","Streaming a music playlist"],1,"Regional flood-risk mapping combines terrain, rainfall and location data, which is large-scale geospatial analytics.",["A payroll spreadsheet has no spatial data.","Compiling code has no spatial data.","Streaming music has no spatial data."]],
[12,4,"In Cyber-Physical Systems (CPS), real-time feedback between sensors and actuators is essential for:",["Data archiving","Closed-loop control","Static data analysis","Batch processing"],1,"CPS joins sensing, computation and actuation: sensors read, computation decides, actuators act, forming a closed control loop.",["Archiving stores data and needs no real-time feedback.","Static analysis works on fixed data, not live feedback.","Batch processing works on groups of data later, not in real time."]],
[12,5,"A GPS-enabled taxi periodically records its location as: (x1,y1,t1),(x2,y2,t2),…,(xn,yn,tn). What does this sequence represent?",["Spatial trajectory","Spatial database","Road topology","Spatial index"],0,"A spatial trajectory is a time-ordered sequence of positions showing a moving object's path.",["A spatial database is a system that stores spatial data, not one path.","Road topology describes how roads connect, not a taxi's movement.","A spatial index is a structure for fast spatial search."]],
[12,6,"__________ refers to outsourcing location-based sensing or data-collection tasks to a crowd of mobile users who gather data at specific places and times.",["Spatial trajectory","Spatial crowdsourcing","Time series","Road network graph"],1,"Spatial crowdsourcing assigns location- and time-specific sensing tasks to mobile participants, such as reporting road conditions at given spots.",["A spatial trajectory is a moving object's time-ordered path, not a task-assignment method.","A time series is data ordered in time, not a way to outsource tasks.","A road network graph models roads, not crowd tasks."]],
[12,7,"In V2V communication, the primary objective is:",["Providing internet access to vehicles","Exchanging safety-critical information such as speed, position, and braking","Supporting infotainment systems","Uploading vehicle data to cloud storage"],1,"V2V sends direct vehicle-to-vehicle safety messages (speed, heading, braking, lane changes) to prevent collisions.",["V2V is not meant to provide internet access.","V2V is not meant for entertainment.","Uploading to the cloud is not V2V's primary goal; it is direct vehicle-to-vehicle messaging."]],
[12,8,"A connected-vehicle system where onboard sensors capture data, roadside units preprocess and react locally, and the cloud performs fleet-wide long-term analytics is BEST described as:",["Cloud-only computing","Edge computing with no cloud","An integrated Edge–Fog–Cloud architecture","A single centralized server"],2,"Onboard sensors (edge), roadside units (fog) and the cloud for long-term analytics spread computation over three layers.",["The system also processes locally, so it is not cloud-only.","The cloud does fleet-wide analytics, so the cloud is used.","Computation is distributed, not on one central server."]],
[12,9,"A major benefit of real-time mobility analytics in urban transport systems is:",["Eliminating the need for traffic laws","Dynamic traffic signal optimization based on live vehicle density","Reducing vehicle manufacturing costs","Preventing all road accidents"],1,"Live data from sensors, cameras and GPS lets signals and routes adapt dynamically, reducing congestion and delays.",["Analytics does not remove the need for traffic laws.","Analytics does not change manufacturing costs.","Analytics can reduce accidents but cannot prevent all of them."]],
[12,10,"A multimedia application needs to deliver extremely high-resolution video and augmented-reality content to mobile users. Which 5G service category is most directly suited to this requirement?",["eMBB","mMTC","URLLC","NFC"],0,"Enhanced Mobile Broadband (eMBB) provides very high data rates and bandwidth efficiency, suited to high-resolution video and AR/VR.",["mMTC serves huge numbers of low-power IoT devices, not high data rates.","URLLC targets ultra-reliable low latency, not maximum bandwidth.","NFC is a short-range contactless technology, not a 5G service category."]]
];
const L="ABCD",out=document.getElementById("out"),nav=document.getElementById("nav");
let cw=0;
D.forEach(([w,n,q,o,a,why,wr],i)=>{
 if(w!==cw){cw=w;out.insertAdjacentHTML("beforeend",`<h2 id="w${w}">Week ${w}</h2>`);nav.insertAdjacentHTML("beforeend",`<a href="#w${w}"><button>Week ${w}</button></a>`)}
 let k=0;
 const wrong=o.map((_,j)=>j).filter(j=>j!==a).map(j=>`<li><b>${L[j]} is wrong:</b> ${wr[k++]}</li>`).join("");
 out.insertAdjacentHTML("beforeend",`<article id="a${i}"><h3>Week ${w} · Question ${n}</h3><p class="q">${q}</p><ol class="o">${o.map((t,j)=>`<li>${L[j]}. ${t}</li>`).join("")}</ol><button class="tog" aria-expanded="false">Show answer</button><div class="a"><p class="ans"><b>Correct answer: ${L[a]}</b></p><p class="why"><b>Why ${L[a]} is right:</b> ${why}</p><p class="lab">Why the other options are wrong</p><ul class="wr">${wrong}</ul></div></article>`);
});
function setAll(open){document.querySelectorAll("article").forEach(a=>{a.classList.toggle("open",open);a.querySelector(".tog").textContent=open?"Hide answer":"Show answer";a.querySelector(".tog").setAttribute("aria-expanded",open)})}
nav.insertAdjacentHTML("afterbegin",`<button id="all">Show all answers</button><button id="none">Hide all answers</button>`);
document.getElementById("all").onclick=()=>setAll(true);
document.getElementById("none").onclick=()=>setAll(false);
out.addEventListener("click",e=>{const b=e.target.closest(".tog");if(!b)return;const a=b.closest("article"),o=a.classList.toggle("open");b.textContent=o?"Hide answer":"Show answer";b.setAttribute("aria-expanded",o)});
</script>
