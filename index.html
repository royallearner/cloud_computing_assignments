<h1>Cloud Computing – Question Bank</h1>
<p class="sub">NPTEL, IIT Kharagpur. Each answer shows the correct option, why it is right, and why every other option is wrong.</p>

<script>
// [week, number, question, [options A-D], answer index, why correct, [why wrong for each other option, in order]]
const D=[
[1,1,"Which of the following best represents the meaning of resource pooling in cloud computing?",["Every customer receives a permanently dedicated physical server.","Computing resources are dynamically assigned to multiple customers using a shared infrastructure.","Resources can only be accessed from a local network.","Users must manually allocate hardware before using cloud services."],1,"Resource pooling is a NIST essential characteristic: one shared pool of resources serves many customers and is assigned and reassigned as demand changes.",["A dedicated server per customer is the opposite of pooling.","Cloud resources are reachable over the network (broad network access), not only a local one.","Cloud users provision resources on demand with no manual hardware allocation."]],
[1,2,"A startup rents virtual servers on Amazon EC2. The team installs and patches its own operating system, configures the web server, and manages the runtime and applications itself. The provider supplies only the virtualized compute, storage, and networking. This is best classified as:",["SaaS","PaaS","IaaS","FaaS"],2,"In IaaS the provider gives virtual compute, storage and networking, and the customer manages the OS, runtime and applications.",["In SaaS the provider runs everything, including the application.","In PaaS the provider also manages the OS and runtime; the customer only deploys code.","In FaaS the customer uploads small functions and manages no servers or OS."]],
[1,3,"Which deployment model allows an organization to maintain cloud infrastructure exclusively for its own use, either on-premises or hosted by a third party?",["Public Cloud","Hybrid Cloud","Community Cloud","Private Cloud"],3,"A private cloud is dedicated to one organization, giving more control over security, compliance and resources.",["A public cloud is open to the general public and shared.","A hybrid cloud combines private and public clouds, so it is not exclusive.","A community cloud is shared by several organizations with common concerns."]],
[1,4,"Virtualization technology allows multiple virtual machines (VMs) to run on a single physical system or on a cluster of physical systems. Which of the following statements is the MOST accurate?",["Each VM always shares the same operating system kernel with the host OS.","Multiple VMs can run different operating systems on the same physical machine simultaneously.","Virtualization is only possible in cloud computing environments.","Virtualization prevents resource overcommitment on the host system."],1,"Hypervisors such as VMware and KVM let VMs with different guest operating systems share the same hardware at once.",["Sharing the host kernel describes containers; a full VM has its own guest kernel.","Virtualization existed before cloud computing and works on ordinary servers and desktops.","Overcommitting CPU or memory is a commonly used feature, not something virtualization prevents."]],
[1,5,"Consider the following statements about distributed systems (DS): (i) DS can improve scalability by adding more nodes to the system. (ii) DS can increase fault tolerance through data and service replication. (iii) DS guarantees lower latency for every single operation compared to a centralized system. Choose the MOST APPROPRIATE option:",["(i) and (ii)","Only (iii)","(i) and (iii)","(i), (ii), and (iii)"],0,"(i) and (ii) are true. (iii) is false because distribution adds network communication and coordination overhead, so some operations get slower.",["Statement (iii) is false, so \"only (iii)\" cannot be right; it also drops the true (i) and (ii).","This includes the false statement (iii).","This also includes the false statement (iii)."]],
[1,6,"The combination of Service-Oriented Architecture (SOA) and Cloud Computing led to a paradigm where almost any IT capability can be delivered as a network-accessible service. This is often referred to as:",["FTP","SNTP","XaaS","FaaS"],2,"XaaS means Anything/Everything as a Service, the umbrella term for delivering diverse IT capabilities as services.",["FTP is a file transfer protocol.","SNTP is a time synchronization protocol.","FaaS (Functions as a Service) is only one specific service model, not the broad paradigm."]],
[1,7,"Which of the following correctly describes a Type-2 (hosted) hypervisor?",["It runs directly on the physical hardware without any underlying operating system.","It runs as an application on top of a host operating system.","It always provides lower virtualization overhead than a Type-1 hypervisor.","It cannot run more than one virtual machine at a time."],1,"A Type-2 hypervisor (VirtualBox, VMware Workstation) is an application running on a host OS.",["That describes a Type-1 (bare-metal) hypervisor.","Type-1 usually has lower overhead, because Type-2 goes through the host OS.","Hosted hypervisors can run many VMs at the same time."]],
[1,8,"Which of the following are advantages of Platform-as-a-Service (PaaS)? (i) Developers can focus primarily on application development. (ii) Automatic software updates for the underlying platform. (iii) Complete control over physical server hardware. (iv) Faster application deployment.",["(i), (ii), and (iv)","(ii) and (iii)","(i) and (iii)","(i), (ii), (iii), and (iv)"],0,"PaaS hides infrastructure and provides a managed runtime, so (i), (ii) and (iv) are advantages.",["It includes (iii), which is false, and leaves out (i) and (iv).","It includes (iii), which is false, and leaves out (ii) and (iv).","It includes (iii): PaaS users never control physical hardware."]],
[1,9,"Which of the following services is most likely to be classified as Infrastructure as a Service (IaaS)?",["Microsoft Word Online","Amazon EC2 Virtual Machines","Google Docs","Salesforce CRM"],1,"EC2 provides virtual machines where users manage the OS, software and applications, which is IaaS.",["Word Online is a ready-to-use application (SaaS).","Google Docs is a ready-to-use application (SaaS).","Salesforce CRM is a ready-to-use application (SaaS)."]],
[1,10,"A __________ is a form of distributed computing in which a large number of geographically dispersed and often heterogeneous resources across multiple administrative domains are loosely coupled and coordinated to work together on a common, large-scale task.",["Cluster","Grid","Node","Hypervisor"],1,"A grid coordinates dispersed, heterogeneous, loosely coupled resources from several administrative domains.",["A cluster is tightly coupled and usually located together.","A node is just one machine.","A hypervisor is virtualization software, not a distributed system."]],
[2,1,"A virtualization solution requires the guest operating system to invoke hypercalls instead of executing certain privileged instructions directly. This approach is known as:",["Full Virtualization","Hardware-assisted Virtualization","Para-virtualization","Containerization"],2,"Para-virtualization modifies the guest OS so privileged operations go through hypercalls to the hypervisor. This lowers overhead but needs OS modification.",["Full virtualization runs an unmodified guest OS, so no hypercalls are needed.","Hardware-assisted virtualization uses CPU extensions with an unmodified guest OS.","Containers share the host kernel and have no guest OS making hypercalls."]],
[2,2,"Which of the following is a key characteristic of full (hardware-assisted) virtualization, as opposed to para-virtualization?",["Guest OS must be modified to issue hypercalls to the hypervisor.","Guest OS runs unmodified, with the hypervisor and CPU extensions handling privileged instructions.","Guest and host must share the same operating system kernel.","No hypervisor is involved at all."],1,"The guest OS stays unmodified while CPU extensions (Intel VT-x, AMD-V) and the hypervisor handle privileged instructions transparently.",["That describes para-virtualization.","Sharing one kernel describes containers.","A hypervisor is always present in virtualization."]],
[2,3,"Which statement about a public cloud is MOST accurate?",["It is dedicated to, and controlled by, a single organization behind its own firewall.","Its infrastructure is provisioned for open use by the general public and is owned and operated by a cloud service provider.","It is shared only among organizations that have common regulatory concerns.","It always guarantees stronger data isolation than a private cloud."],1,"A public cloud is open to the general public and is owned, managed and operated by a cloud service provider on its own premises.",["That describes a private cloud.","That describes a community cloud.","Private clouds typically provide stronger isolation, and \"always\" makes this false."]],
[2,4,"An application must repeatedly navigate, randomly access, and modify elements of a moderately sized XML document held in memory. Which XML parser API is MOST appropriate?",["SAX (push-based, event-driven, forward-only)","StAX (pull-based, event-driven, forward-only)","DOM (builds an in-memory tree allowing random access and modification)","None; an XML document cannot be modified once parsed"],2,"DOM builds the whole document as an in-memory tree, so you can jump to any element and change it.",["SAX is forward-only streaming; it cannot revisit or modify elements.","StAX is also forward-only streaming and not built for random access or edits.","XML documents can be modified once parsed, for example with DOM."]],
[2,5,"Which statement correctly distinguishes a 'host OS', a 'guest OS', and a 'hypervisor'?",["The host OS runs inside a VM, the guest OS runs on bare metal, and the hypervisor is a user application.","The hypervisor creates and manages VMs; each guest OS runs inside a VM; and for a Type-2 hypervisor, the host OS is the OS on which the hypervisor runs.","The guest OS and host OS are always identical copies of the same operating system.","The hypervisor is simply the hardware layer located beneath the host OS."],1,"The hypervisor creates and manages VMs, each guest OS runs inside its own VM, and in a Type-2 setup the host OS is the OS the hypervisor runs on.",["This reverses the host and guest roles.","Guest and host can be completely different operating systems.","The hypervisor is software, not a hardware layer."]],
[2,6,"An enterprise migrates its private cloud to a third-party managed data center. Which of the following concerns should be evaluated? (i) Service availability guarantees (SLAs) (ii) Compliance with data protection regulations (iii) Network latency between users and cloud resources",["Only (i)","(i) and (ii)","(ii) and (iii)","(i), (ii), and (iii)"],3,"All three matter: the applications now depend on an external provider's SLAs, legal rules about data location, and network performance.",["Checking only SLAs ignores compliance and latency.","This ignores network latency.","This ignores the SLA guarantees."]],
[2,7,"In the traditional web services stack, which technology is used to describe a web service's interface — its operations, input/output messages, and how to invoke it?",["UDDI","WSDL","SMTP","HTML"],1,"WSDL is an XML-based language that describes a service's operations, message formats and binding details.",["UDDI is the registry used to discover services, not to describe them.","SMTP is an email transport protocol.","HTML is a markup language for web pages."]],
[2,8,"Traditional SOAP-based web services provide which of the following capabilities? (i) Platform-independent communication (ii) XML-based message exchange (iii) Automatic service discovery through UDDI (iv) Guaranteed microsecond-level response latency",["(i), (ii), and (iii)","(ii) and (iv)","Only (i)","All of the above"],0,"SOAP services give interoperability using XML and WSDL, and discovery through UDDI. They cannot promise microsecond latency because XML processing adds overhead.",["It includes (iv), which is false, and leaves out (i) and (iii).","It lists only (i), but (ii) and (iii) are also true.","It includes (iv), which is false."]],
[2,9,"Which of the following problems are effectively addressed by traditional web services, and which are NOT? (i) Passing through firewalls using standard HTTP/HTTPS (ii) Enabling interoperability across different programming languages and operating systems (iii) Ultra-low-latency, real-time inter-service communication (iv) Service discovery through registries like UDDI",["Only (i) and (ii) are addressed","(i), (ii), and (iv) are addressed; (iii) is NOT addressed","Only (ii) is addressed","All are addressed"],1,"HTTP/HTTPS, XML/SOAP/WSDL and UDDI cover (i), (ii) and (iv). XML parsing and SOAP overhead add delay, so (iii) is not addressed; gRPC suits real-time needs better.",["This misses (iv), which UDDI does address.","This misses (i) and (iv), which are also addressed.","This wrongly claims (iii) is addressed."]],
[2,10,"In the Service-Oriented Architecture (SOA) model, which set of operations correctly maps the interactions among the service provider, service registry, and service requestor?",["Publish (provider → registry), Find (requestor → registry), Bind (requestor → provider)","Publish (requestor → provider), Find (provider → registry), Bind (registry → requestor)","Bind (provider → registry), Publish (requestor → registry), Find (provider → requestor)","Find (provider → registry), Publish (requestor → registry), Bind (provider → provider)"],0,"The provider publishes its description to the registry, the requestor finds it there, then binds to the provider and invokes it directly.",["Here the roles are mixed up: the requestor does not publish to the provider.","Here the provider binds to the registry and the requestor publishes, which reverses their roles.","Here the requestor publishes and the provider binds to itself, which makes no sense."]],
[3,1,"Which of the following is least likely to be specified in an operational cloud Service Level Agreement (SLA)?",["Recovery Time Objective (RTO)","Exact encryption algorithm and key storage procedures","Mean Time To Repair (MTTR) for incidents","Penalty / credit calculation for downtime"],1,"An SLA states service-level commitments. Low-level security details such as exact algorithms and key storage belong in security or operational documents.",["RTO is a recovery commitment and is commonly stated in SLAs.","MTTR measures how fast incidents are fixed and is commonly stated.","Credits or penalties for downtime are a standard SLA term."]],
[3,2,"A multilevel SLA generally consists of which of the following levels? (i) Corporate Level (ii) Customer Level (iii) Service Level",["Only (i)","(i) and (ii)","(ii) and (iii)","(i), (ii), and (iii)"],3,"A multilevel SLA has corporate-level terms for all customers, customer-level terms for specific clients, and service-level terms for individual services.",["This leaves out the customer and service levels.","This leaves out the service level.","This leaves out the corporate level."]],
[3,3,"An enterprise signs a three-tier multilevel SLA with a cloud provider. However, the corporate-level SLA guarantees 95% uptime, the customer-level SLA specifies 98% uptime, and the service-level SLA guarantees 99.9% uptime. In case of a service disruption, which level of SLA is the provider LEGALLY BOUND to honor?",["Corporate-level SLA, as it's the broadest agreement","Customer-level SLA, as it's the middle ground","Service-level SLA, as it's the most specific agreement","The provider can choose the lowest applicable SLA"],2,"As given in the course answer key: the service-level SLA is the most specific to actual service delivery, so accountability lies there (99.9%).",["Being the broadest does not make the corporate level the binding one in this answer key.","Being the middle ground does not make the customer level the binding one.","The provider cannot choose the weakest commitment to escape its obligations."]],
[3,4,"Which pair of metrics is most directly used to quantify the reliability and recoverability commitments in a cloud SLA?",["Availability (uptime %) and Mean Time To Recovery (MTTR)","Lines of code and number of microservices","Number of employees and office locations","CPU clock speed and RAM size of the servers"],0,"Availability measures reliability and MTTR measures how quickly service is restored after an incident.",["Code size and microservice count are implementation details, not SLA commitments.","Staff numbers and offices are organizational facts, not service metrics.","Hardware specifications are low-level details, not SLA commitments."]],
[3,5,"A cloud service guarantees 99.9% availability per 30-day month. What is the maximum allowable downtime in that month under the SLA? (Assume 30 days = 720 hours.)",["About 0.72 hours","About 7.2 hours","About 3.6 hours","About 72 minutes"],0,"Allowed downtime = (1 − 0.999) × 720 = 0.72 hours, about 43 minutes.",["7.2 hours is 1% of 720, which matches 99%, not 99.9%.","3.6 hours is 0.5% of 720, which matches 99.5%.","72 minutes is 1.2 hours, more than the 0.72 hours allowed."]],
[3,6,"Which feature primarily enables a parallel database to process large analytical queries faster than a traditional database?",["Exclusive use of SQL","Distributed query execution across multiple computing nodes","Elimination of indexing","Storing all data in a single server"],1,"A parallel database partitions data and runs query operations on many nodes at the same time.",["SQL is only the query language; traditional databases use it too.","Removing indexing does not add parallelism.","One server is the traditional design, with no parallel speed-up."]],
[3,7,"You are building a fraud-detection pipeline that must flag suspicious transactions within a few hundred milliseconds as they arrive. The system must: ingest about 500,000 transactions per second; detect and alert within sub-
